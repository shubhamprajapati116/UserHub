<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UserHub — Modern Identity & User Management</title>

    
    <link rel="preload" as="image" href="/auth-brand-bg.webp" type="image/webp" fetchpriority="high" />

    
    <style>
      #app-shell-preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f19;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #ffffff;
        user-select: none;
        overflow: hidden;
      }

      .app-shell-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 32px 28px;
        max-width: 320px;
        width: 90%;
        background: rgba(17, 24, 39, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .app-shell-logo-wrap {
        position: relative;
        margin-bottom: 16px;
      }

      .app-shell-logo-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 800;
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
        position: relative;
        z-index: 2;
      }

      .app-shell-glow {
        position: absolute;
        inset: -6px;
        border-radius: 18px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.5) 0%, transparent 70%);
        animation: appShellPulse 2.2s ease-in-out infinite;
        z-index: 1;
      }

      .app-shell-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }

      .app-shell-name {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .app-shell-tag {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 3px 7px;
        background: rgba(99, 102, 241, 0.18);
        border: 1px solid rgba(99, 102, 241, 0.35);
        color: #a5b4fc;
        border-radius: 6px;
      }

      .app-shell-progress-bar {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 14px;
      }

      .app-shell-progress-fill {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #818cf8, #38bdf8);
        border-radius: 999px;
        animation: appShellIndeterminate 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .app-shell-status {
        font-size: 0.8rem;
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      @keyframes appShellIndeterminate {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      @keyframes appShellPulse {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      
      <div id="app-shell-preloader" aria-label="Loading UserHub">
        <div class="app-shell-card">
          <div class="app-shell-logo-wrap">
            <div class="app-shell-logo-icon">U</div>
            <div class="app-shell-glow"></div>
          </div>
          <div class="app-shell-brand">
            <span class="app-shell-name">UserHub</span>
            <span class="app-shell-tag">SaaS Platform</span>
          </div>
          <div class="app-shell-progress-bar">
            <div class="app-shell-progress-fill"></div>
          </div>
          <div class="app-shell-status">Connecting to workspace...</div>
        </div>
      </div>
    </div>
    <div id="root-portal"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
